<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- FlowForge Anvil/Hexagon Nodes -->
  <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linejoin="round" />
  <!-- Inside Connective Flow Lines -->
  <path d="M30,38 L50,50 L70,38 M50,50 L50,78" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center Core Node -->
  <circle cx="50" cy="50" r="10" fill="url(#grad)" />
  <circle cx="30" cy="38" r="6" fill="#1d4ed8" />
  <circle cx="70" cy="38" r="6" fill="#6d28d9" />
  <circle cx="50" cy="78" r="6" fill="#be185d" />
